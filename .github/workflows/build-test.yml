name: Build Test (no release)

# Test-build workflow. Mirrors the `build` job of build-all.yml across all
# supported platforms, but DOES NOT create a GitHub Release and DOES NOT
# publish anything. 
#
# Triggered by:
#   - push to the `testing` branch
#   - push to any branch matching `test/**` (e.g. test/macos-fix)
#   - manual dispatch from the Actions tab
#
# Artifacts (installers + portable archives) are kept for 7 days.

on:
  push:
    branches:
      - testing
      - 'test/**'
  workflow_dispatch:
    inputs:
      label:
        description: 'Optional label to include in artifact names'
        required: false
        default: 'manual'

# Cancel an in-progress test build when a newer commit is pushed to the
# same branch -- saves CI minutes while you iterate.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }} ${{ matrix.arch && format('({0})', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04           # Ubuntu 22.04 for GLIBC compatibility (x86_64)
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm       # Ubuntu 22.04 ARM64
            platform: linux
            arch: arm64
          - os: macos-15-intel         # Intel Mac (x86_64)
            platform: macos
            arch: x64
          - os: macos-latest           # Apple Silicon Mac (arm64)
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Verify icons directory
      shell: bash
      run: |
        echo "Checking for icons directory..."
        if [ -d "icons" ]; then
          echo "✓ Icons directory found"
          ls -lh icons/
        else
          echo "⚠ Warning: icons directory not found - will use default icons"
        fi

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install system dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk fuse libfuse2

    - name: Install system dependencies (macOS)
      if: matrix.platform == 'macos'
      run: |
        which rsync || brew install rsync
        brew install create-dmg || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Pre-build matplotlib font cache (macOS)
      if: matrix.platform == 'macos'
      run: |
        python -c "import tkinter; print(f'Tk version: {tkinter.TkVersion}, Tcl version: {tkinter.TclVersion}')"
        python -c "import matplotlib.pyplot as plt; plt.figure()" || echo "Font cache build attempted"

    - name: Build executable with PyInstaller
      run: |
        pyinstaller membrane-kymograph.spec --clean --noconfirm

    - name: Compute dev version label
      id: get_version
      shell: bash
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        # Sanitize branch name for use in filenames (replace '/' with '-')
        BRANCH_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-')
        VERSION="test-${BRANCH_SAFE}-${SHORT_SHA}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building test version: $VERSION"

    - name: Create distribution archive (Linux)
      if: matrix.platform == 'linux'
      run: |
        ARCH=${{ matrix.arch || 'x64' }}
        RELEASE_NAME="membrane-kymograph-${{ steps.get_version.outputs.VERSION }}-linux-${ARCH}"

        mkdir -p "dist/${RELEASE_NAME}"
        cp -r dist/membrane-kymograph "dist/${RELEASE_NAME}/"
        cp install.sh   "dist/${RELEASE_NAME}/"
        cp uninstall.sh "dist/${RELEASE_NAME}/"
        chmod +x "dist/${RELEASE_NAME}/install.sh"
        chmod +x "dist/${RELEASE_NAME}/uninstall.sh"
        if [ -d "icons" ]; then
          cp -r icons "dist/${RELEASE_NAME}/"
        fi

        cd dist
        tar -czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}/"
        rm -rf "${RELEASE_NAME}"
        cd ..

    - name: Create distribution archive (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        cd dist
        7z a -tzip "membrane-kymograph-${{ steps.get_version.outputs.VERSION }}-windows-x64.zip" membrane-kymograph/
        cd ..

    # macOS is DMG-only (no .tar.gz) -- preserves .app bundle structure
    # without code-signing/security-policy issues.

    - name: Create Linux AppImage
      if: matrix.platform == 'linux'
      run: |
        chmod +x create_appimage.sh
        sed -i "s/VERSION=\".*\"/VERSION=\"${{ steps.get_version.outputs.VERSION }}\"/" create_appimage.sh
        ./create_appimage.sh

    - name: Install Inno Setup (Windows)
      if: matrix.platform == 'windows'
      run: |
        choco install innosetup -y

    - name: Create Windows Installer
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}".TrimStart('v')
        (Get-Content installer-windows.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer-windows.iss
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-windows.iss

    - name: Create macOS DMG
      if: matrix.platform == 'macos'
      run: |
        chmod +x create_dmg.sh
        sed -i '' "s/VERSION=\".*\"/VERSION=\"${{ steps.get_version.outputs.VERSION }}\"/" create_dmg.sh
        ./create_dmg.sh

    - name: Verify executable (Linux/macOS)
      if: matrix.platform != 'windows'
      timeout-minutes: 2
      run: |
        if [ -x dist/membrane-kymograph/membrane-kymograph ]; then
          echo "✓ Executable exists and is executable"
          file dist/membrane-kymograph/membrane-kymograph
        else
          echo "✗ Executable not found or not executable"
          exit 1
        fi

    - name: Verify executable (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        if [ -f dist/membrane-kymograph/membrane-kymograph.exe ]; then
          echo "✓ Executable exists"
          ls -lh dist/membrane-kymograph/membrane-kymograph.exe
        else
          echo "✗ Executable not found"
          exit 1
        fi

    - name: Upload Linux artifact
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v5
      with:
        name: test-membrane-kymograph-linux-${{ matrix.arch || 'x64' }}-${{ steps.get_version.outputs.VERSION }}
        path: |
          dist/*.tar.gz
          installers/*.AppImage
        retention-days: 7

    - name: Upload macOS artifact
      if: matrix.platform == 'macos'
      uses: actions/upload-artifact@v5
      with:
        name: test-membrane-kymograph-macos-${{ matrix.arch || 'x64' }}-${{ steps.get_version.outputs.VERSION }}
        path: |
          installers/*.dmg
        retention-days: 7

    - name: Upload Windows artifact
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v5
      with:
        name: test-membrane-kymograph-windows-x64-${{ steps.get_version.outputs.VERSION }}
        path: |
          dist/*.zip
          installers/*.exe
        retention-days: 7

    - name: Build summary
      shell: bash
      run: |
        echo "=== Test Build Summary ==="
        echo "Branch:        ${{ github.ref_name }}"
        echo "Commit:        $(git rev-parse --short HEAD)"
        echo "Version label: ${{ steps.get_version.outputs.VERSION }}"
        echo "Platform:      ${{ matrix.platform }} ${{ matrix.arch }}"
        echo ""
        echo "=== Build Artifacts ==="
        ls -lh dist/
        echo ""
        echo "=== Executable Directory ==="
        du -sh dist/membrane-kymograph/
        if [ "${{ matrix.platform }}" != "windows" ]; then
          echo ""
          echo "=== Executable Info ==="
          file dist/membrane-kymograph/membrane-kymograph
        fi

# Intentionally no `create-release` job.
# To cut an actual GitHub Release, push a v* tag -- that triggers
# build-all.yml (which both builds and releases). This workflow is
# strictly for pre-tag validation of the build pipeline.
